name: Operator eval contracts
on:
  pull_request:
    paths:
      - 'evals/operators/**'
      - 'plugins/kismet-operators/**'
      - '.github/workflows/operator-evals.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r evals/operators/requirements.txt
      - run: python -m unittest discover -s evals/operators -v
